[package]
name = "cleanweb-mobile"
version = "0.1.0"
edition = "2021"

[lib]
name = "cleanweb_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
