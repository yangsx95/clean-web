[package]
name = "cleanweb-mobile"
version = "0.1.0"
edition = "2021"

[lib]
name = "cleanweb_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
cleanweb-rules = { path = "../../../crates/cleanweb-rules" }
cleanweb-subscriptions = { path = "../../../crates/cleanweb-subscriptions" }
jni = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
