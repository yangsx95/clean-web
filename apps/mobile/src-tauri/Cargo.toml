[package]
name = "cleanweb-mobile"
version = "0.1.0"
edition = "2021"

[lib]
name = "cleanweb_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
cleanweb-rules = { path = "../../../crates/cleanweb-rules" }
cleanweb-proxy-import = { path = "../../../crates/cleanweb-proxy-import" }
cleanweb-subscriptions = { path = "../../../crates/cleanweb-subscriptions" }
ipnet = "2"
jni = "0.21"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tauri = { version = "2", features = [] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"
