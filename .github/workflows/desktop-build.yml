name: Desktop Build

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish a GitHub Release after building"
        required: true
        type: choice
        default: "false"
        options:
          - "false"
          - "true"
      release_tag:
        description: "Release tag to publish, for example v0.1.0. Required only when publishing."
        required: false
        type: string
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - ".github/workflows/desktop-build.yml"
      - "package.json"
      - "package-lock.json"
      - "apps/desktop/**"
  pull_request:
    paths:
      - ".github/workflows/desktop-build.yml"
      - "package.json"
      - "package-lock.json"
      - "apps/desktop/**"

permissions:
  contents: read

jobs:
  build-windows:
    name: Build unsigned Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Test frontend
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Test Rust
        working-directory: apps/desktop/src-tauri
        run: cargo test

      - name: Lint Rust
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Build Tauri NSIS installer
        run: npm run tauri -- build --bundles nsis

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cleanweb-windows-unsigned
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/*.exe
          if-no-files-found: error

  build-macos-universal:
    name: Build unsigned macOS Universal DMG
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Test frontend
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Test Rust
        working-directory: apps/desktop/src-tauri
        run: cargo test

      - name: Lint Rust
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Build Tauri Universal DMG
        run: npm run tauri -- build --target universal-apple-darwin --bundles dmg

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cleanweb-macos-universal-unsigned
          path: |
            apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-windows
      - build-macos-universal
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release == 'true'
    permissions:
      contents: write

    steps:
      - name: Validate release tag
        run: |
          if [ -z "${{ inputs.release_tag }}" ]; then
            echo "release_tag is required when publish_release is true" >&2
            exit 1
          fi
          case "${{ inputs.release_tag }}" in
            v*) ;;
            *)
              echo "release_tag must start with v, for example v0.1.0" >&2
              exit 1
              ;;
          esac

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          files: |
            release-artifacts/**/*.dmg
            release-artifacts/**/*.exe
          generate_release_notes: true
