name: Rules Check

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/rules-check.yml"
      - ".mise.toml"
      - "package.json"
      - "resources/rules/**"
      - "resources/rule-sources/**"
      - "scripts/rules/**"
  pull_request:
    paths:
      - ".github/workflows/rules-check.yml"
      - ".mise.toml"
      - "package.json"
      - "resources/rules/**"
      - "resources/rule-sources/**"
      - "scripts/rules/**"

permissions:
  contents: read

jobs:
  validate-rules:
    name: Validate rule resources
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup mise
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Validate Clash rule supplements
        run: mise run rules-check
