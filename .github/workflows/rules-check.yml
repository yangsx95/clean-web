name: Rules Check

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/rules-check.yml"
      - ".mise.toml"
      - "package.json"
      - "resources/rules/**"
      - "resources/rule-sources/**"
      - "scripts/rules/**"
  pull_request:
    paths:
      - ".github/workflows/rules-check.yml"
      - ".mise.toml"
      - "package.json"
      - "resources/rules/**"
      - "resources/rule-sources/**"
      - "scripts/rules/**"

permissions:
  contents: read

jobs:
  validate-rules:
    name: Validate rule resources
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Clash rule supplements
        run: npm run rules:check
