name: Mobile Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mobile-build.yml"
      - "package.json"
      - "package-lock.json"
      - "apps/mobile/**"
      - "packages/frontend/**"
      - "docs/platforms/mobile.md"
      - "docs/platforms/android.md"
      - "docs/platforms/ios.md"
      - "docs/project-structure.md"
  pull_request:
    paths:
      - ".github/workflows/mobile-build.yml"
      - "package.json"
      - "package-lock.json"
      - "apps/mobile/**"
      - "packages/frontend/**"
      - "docs/platforms/mobile.md"
      - "docs/platforms/android.md"
      - "docs/platforms/ios.md"
      - "docs/project-structure.md"

permissions:
  contents: read

jobs:
  build-mobile-web:
    name: Build Tauri mobile frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test shared frontend
        run: npm test

      - name: Build mobile frontend
        run: npm run build:mobile

      - name: Upload mobile frontend dist
        uses: actions/upload-artifact@v7
        with:
          name: cleanweb-mobile-frontend-dist
          path: apps/mobile/dist
          if-no-files-found: error
