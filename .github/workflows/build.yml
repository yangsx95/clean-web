name: Build

on:
  workflow_dispatch:
    inputs:
      build_windows:
        description: "Build the unsigned Windows installer"
        required: true
        type: choice
        default: "true"
        options:
          - "true"
          - "false"
      build_macos:
        description: "Build the unsigned macOS Universal DMG"
        required: true
        type: choice
        default: "true"
        options:
          - "true"
          - "false"
      build_android:
        description: "Build the unsigned Android package"
        required: true
        type: choice
        default: "false"
        options:
          - "false"
          - "true"
      build_ios:
        description: "Build the unsigned iOS simulator package"
        required: true
        type: choice
        default: "false"
        options:
          - "false"
          - "true"
      publish_release:
        description: "Publish a GitHub Release after building"
        required: true
        type: choice
        default: "false"
        options:
          - "false"
          - "true"
      release_tag:
        description: "Release tag to publish, for example v0.1.0. Required only when publishing."
        required: false
        type: string
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - ".github/workflows/build.yml"
      - ".mise.toml"
      - "package.json"
      - "package-lock.json"
      - "apps/desktop/**"
      - "apps/mobile/**"
      - "crates/**"
      - "packages/frontend/**"
      - "docs/platforms/mobile.md"
      - "docs/platforms/android.md"
      - "docs/platforms/ios.md"
      - "docs/project-structure.md"
  pull_request:
    paths:
      - ".github/workflows/build.yml"
      - ".mise.toml"
      - "package.json"
      - "package-lock.json"
      - "apps/desktop/**"
      - "apps/mobile/**"
      - "crates/**"
      - "packages/frontend/**"
      - "docs/platforms/mobile.md"
      - "docs/platforms/android.md"
      - "docs/platforms/ios.md"
      - "docs/project-structure.md"

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect changed targets
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.filter.outputs.desktop }}
      mobile: ${{ steps.filter.outputs.mobile }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect desktop and mobile changes
        id: filter
        shell: bash
        run: |
          set -euo pipefail

          desktop=false
          mobile=false

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            desktop=${{ inputs.build_windows == 'true' || inputs.build_macos == 'true' }}
            mobile=${{ inputs.build_android == 'true' || inputs.build_ios == 'true' }}
          elif [[ "${{ startsWith(github.ref, 'refs/tags/') }}" == "true" ]]; then
            desktop=true
            mobile=true
          else
            if [[ "${{ github.event_name }}" == "pull_request" ]]; then
              base="${{ github.event.pull_request.base.sha }}"
              head="${{ github.event.pull_request.head.sha }}"
            else
              base="${{ github.event.before }}"
              head="${{ github.sha }}"
              if [[ "$base" =~ ^0+$ ]]; then
                base="$(git rev-list --max-parents=0 "$head")"
              fi
            fi

            while IFS= read -r file; do
              case "$file" in
                .github/workflows/build.yml|.mise.toml|package.json|package-lock.json|packages/frontend/**)
                  desktop=true
                  mobile=true
                  ;;
                apps/desktop/**)
                  desktop=true
                  ;;
                crates/**)
                  desktop=true
                  ;;
                apps/mobile/**|docs/platforms/mobile.md|docs/platforms/android.md|docs/platforms/ios.md|docs/project-structure.md)
                  mobile=true
                  ;;
              esac
            done < <(git diff --name-only "$base" "$head")
          fi

          echo "desktop=$desktop" >> "$GITHUB_OUTPUT"
          echo "mobile=$mobile" >> "$GITHUB_OUTPUT"

  checks:
    name: Run shared checks once
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.desktop == 'true' || needs.detect-changes.outputs.mobile == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup mise
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Cache Rust checks
        uses: actions/cache@v4
        with:
          path: ~/.cache/clean-web/mise
          key: rust-checks-${{ runner.os }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock', 'apps/desktop/src-tauri/Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: |
            rust-checks-${{ runner.os }}-

      - name: Install dependencies
        run: mise run install

      - name: Check patch whitespace
        run: mise run diff-check

      - name: Validate bundled rules
        run: mise run rules-check

      - name: Test frontend
        run: mise run test

      - name: Build desktop frontend
        if: needs.detect-changes.outputs.desktop == 'true'
        run: mise run build

      - name: Build mobile frontend
        if: needs.detect-changes.outputs.mobile == 'true'
        run: mise run build-mobile

      - name: Check Rust formatting
        if: needs.detect-changes.outputs.desktop == 'true'
        run: mise run rust-fmt

      - name: Test Rust
        if: needs.detect-changes.outputs.desktop == 'true'
        run: mise run rust-test

      - name: Lint Rust
        if: needs.detect-changes.outputs.desktop == 'true'
        run: mise run rust-lint

  build-windows:
    name: Build unsigned Windows installer
    runs-on: windows-latest
    needs:
      - detect-changes
      - checks
    if: github.event_name != 'pull_request' && needs.detect-changes.outputs.desktop == 'true' && (github.event_name != 'workflow_dispatch' || inputs.build_windows == 'true')

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup mise
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: desktop-windows

      - name: Install frontend dependencies
        run: mise run install

      - name: Build Tauri NSIS installer
        run: mise run desktop-build-windows

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cleanweb-windows-unsigned
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/*.exe
          if-no-files-found: error

  build-macos-universal:
    name: Build unsigned macOS Universal DMG
    runs-on: macos-latest
    needs:
      - detect-changes
      - checks
    if: github.event_name != 'pull_request' && needs.detect-changes.outputs.desktop == 'true' && (github.event_name != 'workflow_dispatch' || inputs.build_macos == 'true')

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup mise
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Install Rust targets
        run: mise run rust-targets-macos

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: desktop-macos

      - name: Install frontend dependencies
        run: mise run install

      - name: Build Tauri Universal DMG
        run: mise run desktop-build-macos

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cleanweb-macos-universal-unsigned
          path: |
            apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
          if-no-files-found: error

  build-android:
    name: Build unsigned Android package
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - checks
    if: github.event_name != 'pull_request' && needs.detect-changes.outputs.mobile == 'true' && (github.event_name != 'workflow_dispatch' || inputs.build_android == 'true')

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup mise
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Rust targets
        run: mise run rust-targets-android

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/mobile/src-tauri -> target
          key: mobile-android

      - name: Install dependencies
        run: mise run install

      - name: Build Android APK
        run: mise run android-build

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cleanweb-android-unsigned
          path: |
            apps/mobile/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            apps/mobile/src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error

  build-ios:
    name: Build unsigned iOS simulator package
    runs-on: macos-latest
    needs:
      - detect-changes
      - checks
    if: github.event_name != 'pull_request' && needs.detect-changes.outputs.mobile == 'true' && (github.event_name != 'workflow_dispatch' || inputs.build_ios == 'true')

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup mise
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Install Rust targets
        run: mise run rust-targets-ios

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/mobile/src-tauri -> target
          key: mobile-ios

      - name: Install dependencies
        run: mise run install

      - name: Build unsigned iOS simulator app
        run: mise run ios-build-sim

      - name: Package iOS artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ios-artifacts
          find apps/mobile/src-tauri/gen/apple -type f -name "*.ipa" -exec cp {} ios-artifacts/ \;
          while IFS= read -r -d '' path; do
            name="$(basename "$path")"
            ditto -c -k --sequesterRsrc --keepParent "$path" "ios-artifacts/${name}.zip"
          done < <(find apps/mobile/src-tauri/gen/apple -type d \( -name "*.app" -o -name "*.xcarchive" \) -print0)
          ls -la ios-artifacts

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cleanweb-ios-simulator-unsigned
          path: ios-artifacts/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - checks
      - build-windows
      - build-macos-universal
      - build-android
      - build-ios
    if: always() && github.event_name == 'workflow_dispatch' && inputs.publish_release == 'true' && needs.checks.result == 'success' && (inputs.build_windows != 'true' || needs.build-windows.result == 'success') && (inputs.build_macos != 'true' || needs.build-macos-universal.result == 'success') && (inputs.build_android != 'true' || needs.build-android.result == 'success') && (inputs.build_ios != 'true' || needs.build-ios.result == 'success')
    permissions:
      contents: write

    steps:
      - name: Validate release tag
        run: |
          if [ "${{ inputs.build_windows }}" != "true" ] && [ "${{ inputs.build_macos }}" != "true" ] && [ "${{ inputs.build_android }}" != "true" ] && [ "${{ inputs.build_ios }}" != "true" ]; then
            echo "At least one build target must be enabled when publishing." >&2
            exit 1
          fi
          if [ -z "${{ inputs.release_tag }}" ]; then
            echo "release_tag is required when publish_release is true" >&2
            exit 1
          fi
          case "${{ inputs.release_tag }}" in
            v*) ;;
            *)
              echo "release_tag must start with v, for example v0.1.0" >&2
              exit 1
              ;;
          esac

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          files: |
            release-artifacts/**/*.dmg
            release-artifacts/**/*.exe
            release-artifacts/**/*.apk
            release-artifacts/**/*.aab
            release-artifacts/**/*.ipa
            release-artifacts/**/*.zip
          generate_release_notes: true
