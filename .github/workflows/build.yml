name: Build

on:
  workflow_dispatch:
    inputs:
      build_windows:
        description: "Build unsigned Windows installers"
        required: true
        type: choice
        default: "true"
        options:
          - "true"
          - "false"
      windows_packages:
        description: "Windows CPU packages to build"
        required: true
        type: choice
        default: "all"
        options:
          - "x64"
          - "arm64"
          - "all"
      build_macos:
        description: "Build macOS DMGs. Uses signed/notarized output when Apple secrets exist, otherwise ad-hoc local testing output."
        required: true
        type: choice
        default: "true"
        options:
          - "true"
          - "false"
      build_android:
        description: "Build Android packages"
        required: true
        type: choice
        default: "false"
        options:
          - "false"
          - "true"
      build_ios:
        description: "Build the unsigned iOS simulator package"
        required: true
        type: choice
        default: "false"
        options:
          - "false"
          - "true"
      publish_release:
        description: "Publish a GitHub Release after building"
        required: true
        type: choice
        default: "false"
        options:
          - "false"
          - "true"
      release_tag:
        description: "Release tag to publish, for example v0.1.0. Required only when publishing."
        required: false
        type: string
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - ".github/workflows/build.yml"
      - ".mise.toml"
      - "package.json"
      - "package-lock.json"
      - "apps/desktop/**"
      - "apps/mobile/**"
      - "crates/**"
      - "packages/frontend/**"
      - "docs/platforms/mobile.md"
      - "docs/platforms/android.md"
      - "docs/platforms/ios.md"
      - "docs/project-structure.md"
  pull_request:
    paths:
      - ".github/workflows/build.yml"
      - ".mise.toml"
      - "package.json"
      - "package-lock.json"
      - "apps/desktop/**"
      - "apps/mobile/**"
      - "crates/**"
      - "packages/frontend/**"
      - "docs/platforms/mobile.md"
      - "docs/platforms/android.md"
      - "docs/platforms/ios.md"
      - "docs/project-structure.md"

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect changed targets
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.filter.outputs.desktop }}
      mobile: ${{ steps.filter.outputs.mobile }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect desktop and mobile changes
        id: filter
        shell: bash
        run: |
          set -euo pipefail

          desktop=false
          mobile=false

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            desktop=${{ inputs.build_windows == 'true' || inputs.build_macos == 'true' }}
            mobile=${{ inputs.build_android == 'true' || inputs.build_ios == 'true' }}
          elif [[ "${{ startsWith(github.ref, 'refs/tags/') }}" == "true" ]]; then
            desktop=true
            mobile=true
          else
            if [[ "${{ github.event_name }}" == "pull_request" ]]; then
              base="${{ github.event.pull_request.base.sha }}"
              head="${{ github.event.pull_request.head.sha }}"
            else
              base="${{ github.event.before }}"
              head="${{ github.sha }}"
              if [[ "$base" =~ ^0+$ ]]; then
                base="$(git rev-list --max-parents=0 "$head")"
              fi
            fi

            while IFS= read -r file; do
              case "$file" in
                .github/workflows/build.yml|.mise.toml)
                  desktop=true
                  ;;
                package.json|package-lock.json|packages/frontend/**)
                  desktop=true
                  mobile=true
                  ;;
                apps/desktop/**)
                  desktop=true
                  ;;
                crates/**)
                  desktop=true
                  ;;
                apps/mobile/**|docs/platforms/mobile.md|docs/platforms/android.md|docs/platforms/ios.md|docs/project-structure.md)
                  mobile=true
                  ;;
              esac
            done < <(git diff --name-only "$base" "$head")
          fi

          echo "desktop=$desktop" >> "$GITHUB_OUTPUT"
          echo "mobile=$mobile" >> "$GITHUB_OUTPUT"

  static-validation:
    name: Validate static assets
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.desktop == 'true' || needs.detect-changes.outputs.mobile == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check patch whitespace
        run: git diff --check

      - name: Validate bundled rules
        run: node scripts/rules/validate-clash-rules.mjs

  frontend-validation:
    name: Validate frontend
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.desktop == 'true' || needs.detect-changes.outputs.mobile == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test frontend
        run: npm test

      - name: Build desktop frontend
        if: needs.detect-changes.outputs.desktop == 'true'
        run: npm run build

      - name: Build mobile frontend
        if: needs.detect-changes.outputs.mobile == 'true'
        run: npm run build:mobile

  desktop-rust-validation:
    name: Validate desktop Rust
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.desktop == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust checks
        uses: actions/cache@v5
        with:
          path: ~/.cache/clean-web/mise
          key: rust-checks-${{ runner.os }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock', 'apps/desktop/src-tauri/Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: |
            rust-checks-${{ runner.os }}-

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            pkg-config \
            xdg-utils

      - name: Check Rust formatting
        run: cd apps/desktop/src-tauri && cargo fmt --check

      - name: Test Rust
        run: node scripts/mise/rust-task.mjs test

      - name: Lint Rust
        run: node scripts/mise/rust-task.mjs lint

  build-windows:
    name: Build unsigned Windows installer (${{ matrix.arch }})
    runs-on: windows-latest
    needs:
      - detect-changes
      - static-validation
    if: github.event_name != 'pull_request' && needs.detect-changes.outputs.desktop == 'true' && (github.event_name != 'workflow_dispatch' || inputs.build_windows == 'true')
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            rust_target: x86_64-pc-windows-msvc
            artifact_suffix: x64
            nsis_path: apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            msi_path: apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          - arch: arm64
            rust_target: aarch64-pc-windows-msvc
            artifact_suffix: arm64
            nsis_path: apps/desktop/src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*.exe
            msi_path: apps/desktop/src-tauri/target/aarch64-pc-windows-msvc/release/bundle/msi/*.msi

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve Windows package selection
        id: package
        shell: pwsh
        run: |
          $selected = "all"
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $selected = "${{ inputs.windows_packages }}"
          } elseif ("${{ startsWith(github.ref, 'refs/tags/') }}" -eq "true") {
            $selected = "all"
          }
          $shouldBuild = ($selected -eq "all" -or $selected -eq "${{ matrix.arch }}")
          "should_build=$($shouldBuild.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Setup Node
        if: steps.package.outputs.should_build == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        if: steps.package.outputs.should_build == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust target
        if: steps.package.outputs.should_build == 'true'
        run: rustup target add ${{ matrix.rust_target }}

      - name: Cache Rust
        if: steps.package.outputs.should_build == 'true'
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: desktop-windows-${{ matrix.arch }}
          save-if: false

      - name: Install frontend dependencies
        if: steps.package.outputs.should_build == 'true'
        run: npm ci

      - name: Build Tauri Windows installers
        if: steps.package.outputs.should_build == 'true'
        run: npm run tauri -- build --target ${{ matrix.rust_target }} --bundles nsis,msi

      - name: Upload Windows NSIS artifact
        if: steps.package.outputs.should_build == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: cleanweb-windows-${{ matrix.artifact_suffix }}-nsis-unsigned
          path: ${{ matrix.nsis_path }}
          if-no-files-found: error

      - name: Upload Windows MSI artifact
        if: steps.package.outputs.should_build == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: cleanweb-windows-${{ matrix.artifact_suffix }}-msi-unsigned
          path: ${{ matrix.msi_path }}
          if-no-files-found: error

  build-macos:
    name: Build macOS DMG (${{ matrix.package }})
    runs-on: macos-latest
    needs:
      - detect-changes
      - static-validation
    if: github.event_name != 'pull_request' && needs.detect-changes.outputs.desktop == 'true' && (github.event_name != 'workflow_dispatch' || inputs.build_macos == 'true')
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: arm64
            rust_target: aarch64-apple-darwin
            artifact_suffix: arm64
            bundle_path: apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust target
        run: rustup target add aarch64-apple-darwin

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: desktop-macos-${{ matrix.package }}
          save-if: false

      - name: Install frontend dependencies
        run: npm ci

      - name: Detect macOS signing credentials
        id: macos_signing
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "$MACOS_CERTIFICATE_P12_BASE64" \
            && -n "$MACOS_CERTIFICATE_PASSWORD" \
            && -n "$MACOS_SIGNING_IDENTITY" \
            && -n "$APPLE_ID" \
            && -n "$APPLE_TEAM_ID" \
            && -n "$APPLE_APP_SPECIFIC_PASSWORD" ]]; then
            echo "mode=signed-notarized" >> "$GITHUB_OUTPUT"
          else
            echo "mode=local-testing" >> "$GITHUB_OUTPUT"
            if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.publish_release }}" == "true" ]]; then
              echo "macOS release publishing requires Developer ID signing and notarization secrets." >&2
              echo "Configure MACOS_CERTIFICATE_P12_BASE64, MACOS_CERTIFICATE_PASSWORD, MACOS_SIGNING_IDENTITY, APPLE_ID, APPLE_TEAM_ID, and APPLE_APP_SPECIFIC_PASSWORD." >&2
              exit 1
            fi
          fi

      - name: Import macOS Developer ID certificate
        if: steps.macos_signing.outputs.mode == 'signed-notarized'
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/cleanweb-signing.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/cleanweb-signing.p12"
          echo "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$KEYCHAIN_PATH"

      - name: Build Tauri DMG
        run: npm run tauri -- build --target ${{ matrix.rust_target }} --bundles dmg

      - name: Package macOS DMGs
        shell: bash
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p macos-artifacts
          shopt -s nullglob
          for dmg in ${{ matrix.bundle_path }}; do
            base="$(basename "$dmg" .dmg)"
            if [[ "${{ steps.macos_signing.outputs.mode }}" == "signed-notarized" ]]; then
              scripts/release/package-signed-macos-dmg.sh \
                "$dmg" \
                "macos-artifacts/${base}_SIGNED_NOTARIZED.dmg"
              scripts/release/verify-macos-dmg.sh "macos-artifacts/${base}_SIGNED_NOTARIZED.dmg"
            else
              cat > macos-artifacts/README-LOCAL-TESTING-MACOS.txt <<'TXT'
          These macOS DMGs are ad-hoc signed local-testing artifacts.

          They are intended for developer testing only. Browser downloads may still
          be blocked by Gatekeeper because they are not Developer ID notarized.
          TXT
              scripts/release/package-local-macos-dmg.sh \
                "$dmg" \
                "macos-artifacts/${base}_ADHOC_SIGNED_LOCAL_TESTING_ONLY.dmg"
            fi
          done
          test "$(find macos-artifacts -name '*.dmg' | wc -l | tr -d ' ')" != "0"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cleanweb-macos-${{ matrix.artifact_suffix }}
          path: macos-artifacts/*
          if-no-files-found: error

  build-android:
    name: Build Android packages
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - static-validation
    if: github.event_name != 'pull_request' && needs.detect-changes.outputs.mobile == 'true' && (github.event_name != 'workflow_dispatch' || inputs.build_android == 'true')

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Rust targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/mobile/src-tauri -> target
          key: mobile-android
          save-if: false

      - name: Install dependencies
        run: npm ci

      - name: Build Android APK
        run: npm run tauri:mobile -- android build --apk

      - name: Create Android test signing key
        run: |
          mkdir -p build/android-signing
          keytool -genkeypair \
            -v \
            -keystore build/android-signing/cleanweb-debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=CleanWeb,C=US"

      - name: Sign Android APKs for sideload testing
        run: |
          set -euo pipefail
          mkdir -p build/android-signed
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          mapfile -t APK_FILES < <(find apps/mobile/src-tauri/gen/android/app/build/outputs/apk -type f -name '*-unsigned.apk' | sort)
          if [ "${#APK_FILES[@]}" -eq 0 ]; then
            echo "No unsigned APK files found to sign." >&2
            exit 1
          fi
          for APK in "${APK_FILES[@]}"; do
            BASENAME="$(basename "$APK" .apk)"
            OUT="build/android-signed/${BASENAME%-unsigned}-debug-signed.apk"
            "$APKSIGNER" sign \
              --ks build/android-signing/cleanweb-debug.keystore \
              --ks-pass pass:android \
              --key-pass pass:android \
              --out "$OUT" \
              "$APK"
            "$APKSIGNER" verify --verbose "$OUT"
          done

      - name: Upload unsigned Android artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cleanweb-android-unsigned
          path: |
            apps/mobile/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            apps/mobile/src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error

      - name: Upload debug-signed Android artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cleanweb-android-debug-signed
          path: build/android-signed/*.apk
          if-no-files-found: error

  build-ios:
    name: Build unsigned iOS simulator package
    runs-on: macos-latest
    needs:
      - detect-changes
      - static-validation
    if: github.event_name != 'pull_request' && needs.detect-changes.outputs.mobile == 'true' && (github.event_name != 'workflow_dispatch' || inputs.build_ios == 'true')

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust targets
        run: rustup target add aarch64-apple-ios-sim x86_64-apple-ios

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/mobile/src-tauri -> target
          key: mobile-ios
          save-if: false

      - name: Install dependencies
        run: npm ci

      - name: Build unsigned iOS simulator app
        run: npm run tauri:mobile -- ios build --target aarch64-sim --no-sign --ci

      - name: Package iOS artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ios-artifacts
          find apps/mobile/src-tauri/gen/apple -type f -name "*.ipa" -exec cp {} ios-artifacts/ \;
          while IFS= read -r -d '' path; do
            name="$(basename "$path")"
            ditto -c -k --sequesterRsrc --keepParent "$path" "ios-artifacts/${name}.zip"
          done < <(find apps/mobile/src-tauri/gen/apple -type d \( -name "*.app" -o -name "*.xcarchive" \) -print0)
          ls -la ios-artifacts

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cleanweb-ios-simulator-unsigned
          path: ios-artifacts/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - static-validation
      - frontend-validation
      - desktop-rust-validation
      - build-windows
      - build-macos
      - build-android
      - build-ios
    if: always() && github.event_name == 'workflow_dispatch' && inputs.publish_release == 'true' && needs.static-validation.result == 'success' && needs.frontend-validation.result == 'success' && ((inputs.build_windows != 'true' && inputs.build_macos != 'true') || needs.desktop-rust-validation.result == 'success') && (inputs.build_windows != 'true' || needs.build-windows.result == 'success') && (inputs.build_macos != 'true' || needs.build-macos.result == 'success') && (inputs.build_android != 'true' || needs.build-android.result == 'success') && (inputs.build_ios != 'true' || needs.build-ios.result == 'success')
    permissions:
      contents: write

    steps:
      - name: Validate release tag
        run: |
          if [ "${{ inputs.build_windows }}" != "true" ] && [ "${{ inputs.build_macos }}" != "true" ] && [ "${{ inputs.build_android }}" != "true" ] && [ "${{ inputs.build_ios }}" != "true" ]; then
            echo "At least one build target must be enabled when publishing." >&2
            exit 1
          fi
          if [ -z "${{ inputs.release_tag }}" ]; then
            echo "release_tag is required when publish_release is true" >&2
            exit 1
          fi
          case "${{ inputs.release_tag }}" in
            v*) ;;
            *)
              echo "release_tag must start with v, for example v0.1.0" >&2
              exit 1
              ;;
          esac

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_tag }}
          files: |
            release-artifacts/**/*.dmg
            release-artifacts/**/*.exe
            release-artifacts/**/*.apk
            release-artifacts/**/*.aab
            release-artifacts/**/*.ipa
            release-artifacts/**/*.zip
          generate_release_notes: true
