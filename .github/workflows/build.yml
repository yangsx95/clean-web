name: Build

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish a GitHub Release after building"
        required: true
        type: choice
        default: "false"
        options:
          - "false"
          - "true"
      release_tag:
        description: "Release tag to publish, for example v0.1.0. Required only when publishing."
        required: false
        type: string
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - ".github/workflows/build.yml"
      - "package.json"
      - "package-lock.json"
      - "apps/desktop/**"
      - "apps/mobile/**"
      - "crates/**"
      - "packages/frontend/**"
      - "docs/platforms/mobile.md"
      - "docs/platforms/android.md"
      - "docs/platforms/ios.md"
      - "docs/project-structure.md"
  pull_request:
    paths:
      - ".github/workflows/build.yml"
      - "package.json"
      - "package-lock.json"
      - "apps/desktop/**"
      - "apps/mobile/**"
      - "crates/**"
      - "packages/frontend/**"
      - "docs/platforms/mobile.md"
      - "docs/platforms/android.md"
      - "docs/platforms/ios.md"
      - "docs/project-structure.md"

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect changed targets
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.filter.outputs.desktop }}
      mobile: ${{ steps.filter.outputs.mobile }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect desktop and mobile changes
        id: filter
        shell: bash
        run: |
          set -euo pipefail

          desktop=false
          mobile=false

          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "${{ startsWith(github.ref, 'refs/tags/') }}" == "true" ]]; then
            desktop=true
            mobile=true
          else
            if [[ "${{ github.event_name }}" == "pull_request" ]]; then
              base="${{ github.event.pull_request.base.sha }}"
              head="${{ github.event.pull_request.head.sha }}"
            else
              base="${{ github.event.before }}"
              head="${{ github.sha }}"
              if [[ "$base" =~ ^0+$ ]]; then
                base="$(git rev-list --max-parents=0 "$head")"
              fi
            fi

            while IFS= read -r file; do
              case "$file" in
                .github/workflows/build.yml|package.json|package-lock.json|packages/frontend/*)
                  desktop=true
                  mobile=true
                  ;;
                apps/desktop/*)
                  desktop=true
                  ;;
                crates/*)
                  desktop=true
                  ;;
                apps/mobile/*|docs/platforms/mobile.md|docs/platforms/android.md|docs/platforms/ios.md|docs/project-structure.md)
                  mobile=true
                  ;;
              esac
            done < <(git diff --name-only "$base" "$head")
          fi

          echo "desktop=$desktop" >> "$GITHUB_OUTPUT"
          echo "mobile=$mobile" >> "$GITHUB_OUTPUT"

  build-windows:
    name: Build unsigned Windows installer
    runs-on: windows-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.desktop == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Test frontend
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Test Rust
        working-directory: apps/desktop/src-tauri
        run: cargo test

      - name: Lint Rust
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Build Tauri NSIS installer
        run: npm run tauri -- build --bundles nsis

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cleanweb-windows-unsigned
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/*.exe
          if-no-files-found: error

  build-macos-universal:
    name: Build unsigned macOS Universal DMG
    runs-on: macos-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.desktop == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Test frontend
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Test Rust
        working-directory: apps/desktop/src-tauri
        run: cargo test

      - name: Lint Rust
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Build Tauri Universal DMG
        run: npm run tauri -- build --target universal-apple-darwin --bundles dmg

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cleanweb-macos-universal-unsigned
          path: |
            apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
          if-no-files-found: error

  build-mobile-web:
    name: Build Tauri mobile frontend
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.mobile == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test shared frontend
        run: npm test

      - name: Build mobile frontend
        run: npm run build:mobile

      - name: Package mobile frontend dist
        run: |
          cd apps/mobile
          zip -r ../../cleanweb-mobile-frontend-dist.zip dist

      - name: Upload mobile frontend dist
        uses: actions/upload-artifact@v7
        with:
          name: cleanweb-mobile-frontend-dist
          path: cleanweb-mobile-frontend-dist.zip
          if-no-files-found: error

  build-android:
    name: Build unsigned Android package
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.mobile == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/mobile/src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Test shared frontend
        run: npm test

      - name: Build Android APK
        run: npm run tauri:mobile -- android build --apk

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cleanweb-android-unsigned
          path: |
            apps/mobile/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            apps/mobile/src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error

  build-ios:
    name: Build unsigned iOS package
    runs-on: macos-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.mobile == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/mobile/src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Test shared frontend
        run: npm test

      - name: Build iOS app
        run: npm run tauri:mobile -- ios build

      - name: Package iOS artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ios-artifacts
          find apps/mobile/src-tauri/gen/apple -type f -name "*.ipa" -exec cp {} ios-artifacts/ \;
          while IFS= read -r -d '' path; do
            name="$(basename "$path")"
            ditto -c -k --sequesterRsrc --keepParent "$path" "ios-artifacts/${name}.zip"
          done < <(find apps/mobile/src-tauri/gen/apple -type d \( -name "*.app" -o -name "*.xcarchive" \) -print0)
          ls -la ios-artifacts

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cleanweb-ios-unsigned
          path: ios-artifacts/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-windows
      - build-macos-universal
      - build-mobile-web
      - build-android
      - build-ios
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release == 'true'
    permissions:
      contents: write

    steps:
      - name: Validate release tag
        run: |
          if [ -z "${{ inputs.release_tag }}" ]; then
            echo "release_tag is required when publish_release is true" >&2
            exit 1
          fi
          case "${{ inputs.release_tag }}" in
            v*) ;;
            *)
              echo "release_tag must start with v, for example v0.1.0" >&2
              exit 1
              ;;
          esac

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          files: |
            release-artifacts/**/*.dmg
            release-artifacts/**/*.exe
            release-artifacts/**/*.apk
            release-artifacts/**/*.aab
            release-artifacts/**/*.ipa
            release-artifacts/**/*.zip
          generate_release_notes: true
